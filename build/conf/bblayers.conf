# bblayers.conf – BitBake layers configuration for Raspberry Pi 5 custom build
#
# Before running bitbake, fetch all required layers:
#
#   cd <workspace>
#   git clone --depth 1 -b scarthgap https://git.yoctoproject.org/poky
#   git clone --depth 1 -b scarthgap https://git.openembedded.org/meta-openembedded
#   git clone --depth 1 -b scarthgap https://github.com/agherzan/meta-raspberrypi
#   # This repository provides meta-raspi5-custom:
#   git clone https://github.com/saurabh-git-dev/Raspi-custom-yocto
#
# Then initialise the build environment:
#   source poky/oe-init-build-env build
# (copy / symlink this file and local.conf into build/conf/)
#
# See scripts/setup-build.sh for a fully automated setup.

BBLAYERS ?= " \
  ##OEROOT##/meta \
  ##OEROOT##/meta-poky \
  ##OEROOT##/meta-yocto-bsp \
  ##OEROOT##/../meta-openembedded/meta-oe \
  ##OEROOT##/../meta-openembedded/meta-python \
  ##OEROOT##/../meta-openembedded/meta-multimedia \
  ##OEROOT##/../meta-openembedded/meta-networking \
  ##OEROOT##/../meta-raspberrypi \
  ##OEROOT##/../Raspi-custom-yocto/meta-raspi5-custom \
"
