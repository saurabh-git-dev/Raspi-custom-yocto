# local.conf – BitBake build configuration for Raspberry Pi 5 custom image
# Yocto Project release: Scarthgap (5.0)

# ---------------------------------------------------------------------------
# Target machine
# ---------------------------------------------------------------------------
MACHINE = "raspberrypi5"

# ---------------------------------------------------------------------------
# Distribution policy
# ---------------------------------------------------------------------------
DISTRO = "poky"

# Use systemd as the init manager
DISTRO_FEATURES:append = " systemd"
VIRTUAL-RUNTIME_init_manager = "systemd"
DISTRO_FEATURES_BACKFILL_CONSIDERED:append = " sysvinit"

# ---------------------------------------------------------------------------
# Package manager
# ---------------------------------------------------------------------------
PACKAGE_CLASSES = "package_ipk"

# ---------------------------------------------------------------------------
# SDK / ADT configuration
# ---------------------------------------------------------------------------
EXTRA_IMAGE_FEATURES ?= "debug-tweaks"

# ---------------------------------------------------------------------------
# Parallel build tuning (adjust to match the host CPU count)
# ---------------------------------------------------------------------------
# BB_NUMBER_THREADS ?= "$(nproc)"
# PARALLEL_MAKE ?= "-j$(nproc)"

# ---------------------------------------------------------------------------
# Download / shared-state caches
# These can be shared across multiple builds to save time.
# ---------------------------------------------------------------------------
DL_DIR    ?= "${TOPDIR}/../downloads"
SSTATE_DIR ?= "${TOPDIR}/../sstate-cache"

# ---------------------------------------------------------------------------
# Miscellaneous
# ---------------------------------------------------------------------------
# Accept the Raspberry Pi firmware EULA (required for VC firmware blobs)
LICENSE_FLAGS_ACCEPTED = "synaptics-killswitch"

# Ensure SSH root login works out-of-the-box (remove in production)
EXTRA_IMAGE_FEATURES:append = " allow-empty-password"

# GPU memory split (16 MB for headless use)
GPU_MEM = "16"

# Enable the Raspberry Pi camera subsystem
ENABLE_UART = "1"
ENABLE_I2C  = "1"
ENABLE_SPI  = "1"

# Raspberry Pi 5 uses PCIe for the Hailo M.2 module
RPI_EXTRA_CONFIG:append = '\n# Hailo-8L M.2 key-M via PCIe\ndtparam=pciex1\n'

# ---------------------------------------------------------------------------
# Image-specific settings
# ---------------------------------------------------------------------------
# Root filesystem size for individual A/B slots (must match raspi5-ab.wks)
IMAGE_ROOTFS_SIZE = "3145728"   # 3 GiB in KiB

# Leave 512 MB extra headroom
IMAGE_ROOTFS_EXTRA_SPACE = "524288"

# ---------------------------------------------------------------------------
# Hostname
# ---------------------------------------------------------------------------
hostname_pn-base-files = "raspi5"
